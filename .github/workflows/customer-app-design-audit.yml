name: Customer app design audit

on:
  pull_request:
    paths:
      - 'multivendor-app/**'
      - '.github/workflows/customer-app-design-audit.yml'
  push:
    branches:
      - integration/single-vendor-combined
      - design/multivendor-ui-parity
    paths:
      - 'multivendor-app/**'
      - '.github/workflows/customer-app-design-audit.yml'

jobs:
  design-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multivendor-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: multivendor-app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check multivendor visual rules
        run: npm run check:multivendor-design

      - name: Check single-vendor import boundaries
        run: npm run check:single-vendor-imports
